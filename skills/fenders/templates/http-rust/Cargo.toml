[package]
name = "fenders-http-app"
version = "0.1.0"
edition = "2024"
publish = false

# Its own workspace, so it builds wherever it is copied.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The WASI 0.2 bindings Fenders' own example components use.
wasi = "=0.14.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
